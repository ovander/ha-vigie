[project]
name = "ha-vigie"
version = "0.0.1"
description = "AIS traffic watch and collision alerts for Home Assistant"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Required by pytest-homeassistant-custom-component; pure async tests carry explicit marks
asyncio_mode = "auto"
markers = ["perf: load and timing tests, run nightly (TEST-001 §4.5, §7)"]
addopts = "-m 'not perf'"

[tool.coverage.run]
# Pure modules only (TEST §7 gate 2); module names, since `source` takes no file paths
source = [
    "custom_components.vigie.nmea",
    "custom_components.vigie.geo",
    "custom_components.vigie.state",
    "custom_components.vigie.hub",
]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow typographic characters in docs/strings

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "custom_components/vigie/nmea",
    "custom_components/vigie/geo.py",
    "custom_components/vigie/state.py",
    "custom_components/vigie/hub.py",
]

[[tool.mypy.overrides]]
module = ["homeassistant.*", "voluptuous.*"]
ignore_missing_imports = true
# The pure modules never use HA; mypy only reaches it through the package __init__'s
# TYPE_CHECKING imports, and HA's 3.13 syntax cannot be parsed at python_version 3.12.
follow_imports = "skip"

[[tool.mypy.overrides]]
# HA-side modules are outside the strict set (CLAUDE.md: strict on pure modules); mypy
# would reach them only through the package __init__'s TYPE_CHECKING imports.
module = ["vigie.coordinator"]  # mypy maps custom_components/vigie to "vigie"
follow_imports = "skip"
