[project]
name = "ha-vigie"
version = "0.0.1"
description = "AIS traffic watch and collision alerts for Home Assistant"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/vigie/nmea"]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow typographic characters in docs/strings

[tool.mypy]
python_version = "3.12"
strict = true
files = ["custom_components/vigie/nmea"]

[[tool.mypy.overrides]]
module = ["homeassistant.*", "voluptuous.*"]
ignore_missing_imports = true
