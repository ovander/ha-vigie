blueprint:
  name: Vigie — anchor alarm
  description: >-
    Sends a notification to your phone when Vigie's anchor watch raises its alarm: the boat
    is dragging (its distance from the anchor against the radius), or the receiver has stopped
    giving a position. The alert is an aid: keep a watch on deck.
  domain: automation
  author: ovander
  source_url: https://github.com/ovander/ha-vigie/blob/main/blueprints/automation/vigie/anchor_alarm.yaml
  homeassistant:
    min_version: 2026.2.0
  input:
    anchor_alarm:
      name: Anchor alarm
      description: Your boat's anchor alarm sensor, binary_sensor.<boat>_anchor_alarm.
      selector:
        entity:
          filter:
            - integration: vigie
              domain: binary_sensor
    phone:
      name: Phone
      description: The phone to notify (Home Assistant companion app).
      selector:
        device:
          filter:
            - integration: mobile_app
    critical:
      name: Critical alert
      description: >-
        Rings even when the phone is silenced (iOS needs the companion app's critical-alert
        permission; Android delivers it at once with high priority).
      default: true
      selector:
        boolean: {}

mode: single

triggers:
  - trigger: state
    entity_id: !input anchor_alarm
    to: "on"

variables:
  phone: !input phone
  critical: !input critical
  notify_action: "notify.mobile_app_{{ device_attr(phone, 'name') | slugify }}"
  push_data: >-
    {{ {'ttl': 0, 'priority': 'high', 'push': {'interruption-level': 'critical'}}
       if critical else {'priority': 'high'} }}

actions:
  - action: "{{ notify_action }}"
    data:
      title: "⚓ Anchor alarm"
      # The alarm carries its distance and radius: entity IDs depend on the language (#105)
      message: >-
        {% set alarm = trigger.to_state.attributes %}
        {% if alarm.reason == 'drag' %}
        Dragging: {{ alarm.distance_m | int(0) }} m
        from the anchor (radius {{ alarm.radius_m | int(0) }} m).
        {% else %}
        No position from the receiver: check the GPS and the power.
        {% endif %}
      data: "{{ push_data }}"
