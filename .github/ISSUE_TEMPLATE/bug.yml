name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: input
    id: vigie_version
    attributes:
      label: Vigie version
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version and install type (OS, Container…)
    validations:
      required: true
  - type: input
    id: receiver
    attributes:
      label: AIS receiver model and baud rate
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Devices & services → Vigie → ⋮ → Download diagnostics. Drag the file here.
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      render: text
